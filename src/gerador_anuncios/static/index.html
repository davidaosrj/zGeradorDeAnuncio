<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gerador de Anúncios</title><link rel="icon" type="image/png" href="/favicon.ico"><style>
:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:36px auto;padding:0 20px}header{margin-bottom:24px;display:flex;align-items:center;gap:16px}.brand-logo{width:92px;height:92px;object-fit:contain;flex:none}.heading p{margin-bottom:0}h1{margin:0;font-size:32px}p{color:#64708a}.card{background:#fff;border:1px solid #dfe4ec;border-radius:16px;padding:24px;box-shadow:0 10px 30px #24324a10}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.full{grid-column:1/-1}label{display:block;font-weight:650;font-size:14px;margin-bottom:6px}input,textarea,select{width:100%;padding:12px;border:1px solid #cfd6e2;border-radius:9px;font:inherit}textarea{min-height:76px}small{color:#718099}button{background:#e04b28;color:#fff;border:0;border-radius:10px;padding:13px 20px;font-weight:750;cursor:pointer}button:disabled{opacity:.5}.actions{display:flex;gap:12px;align-items:center;margin-top:20px}pre{white-space:pre-wrap;background:#172033;color:#e8edf7;padding:16px;border-radius:10px;min-height:70px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.brand-logo{width:72px;height:72px}}
</style></head><body><main class="wrap"><header><img class="brand-logo" src="/logo-zonegeeklab3d.png" alt="Logo zonegeeklab3D"><div class="heading"><h1>Gerador de Anúncios</h1><p>Cadastre dados confirmados, envie as fotos reais e gere textos, artes e ZIP por cor.</p></div></header>
<p><a href="/roas">Simulador de ROAS</a> · <a href="/calculadora-marketplaces">Calculadora unificada de marketplaces</a></p><form id="form" class="card"><div class="grid">
<div><label>SKU</label><input name="sku" required placeholder="SKU0011"></div><div><label>Nome do produto</label><input name="nome" required></div>
<div><label>Quantidade</label><input name="quantidade" type="number" min="1" value="1" required></div><div><label>Processo de fabricação</label><input name="processo_fabricacao" placeholder="Impressão 3D FDM"></div>
<div class="full"><label>Dimensões</label><input name="medidas" placeholder="Tamanho: 3,9 cm, Rosca: 15,0 mm, Pino: 7,8 mm"><small>Separe os itens por vírgula.</small></div>
<div><label>Cores selecionáveis</label><input name="cores" placeholder="vermelho, laranja"></div><div><label>Compatibilidade</label><input name="compatibilidade"></div>
<div><label>Itens inclusos</label><textarea name="itens_inclusos"></textarea></div><div><label>Itens não inclusos</label><textarea name="itens_nao_inclusos"></textarea></div>
<div><label>Benefícios confirmados</label><textarea name="beneficios"></textarea></div><div><label>Observações</label><textarea name="observacoes"></textarea></div>
<div class="full"><label>Fotografias reais</label><input name="images" type="file" accept="image/jpeg,image/png,image/webp" multiple required></div>
<div><label>Modo</label><select id="mode"><option value="auto">Automático (Ollama + fallback)</option><option value="offline">Sem Ollama</option><option value="online">Exigir Ollama</option></select></div><div><label>Diretório de saída</label><input id="output-path" placeholder="saida_personalizada ou /mnt/c/Users/..."><small>Vazio usa a pasta padrão. Caminho absoluto exige ALLOW_ABSOLUTE_OUTPUT_PATHS=true.</small></div>
</div><div class="actions"><button id="submit">Cadastrar e gerar</button><span id="state"></span></div><pre id="result">Aguardando dados…</pre></form></main>
<script>const f=document.querySelector('#form'),b=document.querySelector('#submit'),r=document.querySelector('#result'),s=document.querySelector('#state');f.onsubmit=async e=>{e.preventDefault();b.disabled=true;s.textContent='Enviando…';try{let fd=new FormData(f),created=await fetch('/api/products',{method:'POST',body:fd}),a=await created.json();if(!created.ok)throw Error(a.detail||'Falha no cadastro');s.textContent='Gerando…';let query=new URLSearchParams({mode:document.querySelector('#mode').value}),output=document.querySelector('#output-path').value.trim();if(output)query.set('output_path',output);let generated=await fetch(`/api/products/${encodeURIComponent(a.sku)}/generate?${query}`,{method:'POST'}),g=await generated.json();if(!generated.ok)throw Error(g.detail||'Falha na geração');r.textContent=JSON.stringify(g,null,2);s.textContent='Concluído';}catch(err){r.textContent=err.message;s.textContent='Erro';}finally{b.disabled=false}};</script></body></html>
