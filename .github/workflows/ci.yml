name: CI
on:
  push:
  pull_request:
  workflow_call:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: python -m pip install -e '.[test]'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_pricing_site.py --check
      - run: node --check src/gerador_anuncios/static/pricing-engine.js
      - run: node --check src/gerador_anuncios/static/pricing-ui.js
      - run: npm ci --prefix tests/browser
      - run: tests/browser/node_modules/.bin/playwright install --with-deps chromium
      - run: npm test --prefix tests/browser
      - run: docker build -t gerador-anuncios:test .
